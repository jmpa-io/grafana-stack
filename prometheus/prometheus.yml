---
global:
  scrape_interval:      15s
  evaluation_interval:  15s

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets: 
        - prometheus:9090

  - job_name: tempo
    static_configs:
      - targets:
        - tempo:3200

  - job_name: open-telemetry-collector
    static_configs:
      - targets:
        - open-telemetry-collector:8889

  # ── Harrier backend ─────────────────────────────────────────────────────────
  # OTEL metrics from harrier-backend arrive via the collector's prometheus
  # exporter on open-telemetry-collector:8889 (job above), labelled with
  # service_name=harrier-backend. No separate scrape needed here.
  # This entry is intentionally left as a comment for documentation.

