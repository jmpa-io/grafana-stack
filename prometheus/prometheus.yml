---
global:
  scrape_interval:      15s
  evaluation_interval:  15s

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets: 
        - prometheus:9090

  - job_name: tempo
    static_configs:
      - targets:
        - tempo:3200

  - job_name: open-telemetry-collector
    static_configs:
      - targets:
        - open-telemetry-collector:8889

  # ── Harrier backend ─────────────────────────────────────────────────────────
  # Scrapes the Micrometer /actuator/prometheus endpoint directly.
  # harrier-backend must be running on the grafana-stack_default Docker network
  # for this job to succeed. Prometheus will log scrape errors when it is not.
  # To disable: comment out this job or remove this block.
  - job_name: harrier-backend
    metrics_path: /api/v1/actuator/prometheus
    static_configs:
      - targets:
          - harrier-backend:3002

