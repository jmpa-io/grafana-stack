---
global:
  scrape_interval:      15s
  evaluation_interval:  15s

rule_files:
  - /etc/prometheus/rules-sites.yml

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets: 
        - prometheus:9090

  - job_name: tempo
    static_configs:
      - targets:
        - tempo:3200

  - job_name: open-telemetry-collector
    static_configs:
      - targets:
        - open-telemetry-collector:8889

  # uptime, latency and TLS expiry for the public sites, probed from wherever this stack runs.
  # to add a site, add a line to `targets`. each one shows up on the "Sites" dashboard automatically.
  - job_name: blackbox-sites
    scrape_interval: 60s
    metrics_path: /probe
    params:
      module: [https_2xx]
    static_configs:
      - targets:
        - https://jmpa.io
        - https://art.jmpa.io
        - https://startpage.jcleal.me
        - https://portfolio.jcleal.me
        - https://jcleal.me
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-exporter
    static_configs:
      - targets:
        - blackbox-exporter:9115
