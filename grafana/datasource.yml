---
apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:

- name: Prometheus
  type: prometheus
  uid: prometheus
  access: proxy
  orgId: 1
  url: http://prometheus:9090
  user: ''
  password: ''
  database: ''
  basicAuth: false
  isDefault: false
  version: 1
  editable: false
  jsonData:
      exemplarTraceIdDestinations:
        - datasourceUid: tempo
          name: TraceID
      httpMethod: POST

- name: Tempo
  type: tempo
  uid: tempo
  access: proxy
  orgId: 1
  url: http://tempo:3200
  basicAuth: false
  isDefault: true
  version: 1
  editable: false
  apiVersion: 1
  jsonData:
    nodeGraph:
      enabled: true
    search:
      hide: false
    lokiSearch:
      datasourceUid: loki
    # Trace -> logs: Loki streams are labelled service_name (by the collector's
    # loki exporter), so map the span's service.name onto it. compose_service is
    # kept for services that label their logs that way.
    tracesToLogsV2:
      datasourceUid: loki
      filterBySpanID: false
      filterByTraceID: true
      # Logs are written as the request finishes, a hair after the span ends.
      spanStartTimeShift: -1m
      spanEndTimeShift: 1m
      tags:
        - key: service.name
          value: service_name
        - key: compose_service

- name: Loki
  type: loki
  uid: loki
  access: proxy
  orgId: 1
  url: http://loki:3100
  user: ''
  password: ''
  database: ''
  basicAuth: false
  isDefault: false
  version: 1
  editable: false
  jsonData:
    derivedFields:
      # Matches "trace_id=<id>" text logs and the collector loki exporter's JSON
      # ("traceid":"<id>").
      - datasourceUid: tempo
        matcherRegex: (?:trace_id=|"traceid":")(\w+)
        name: TraceID
        url: $${__value.raw}

