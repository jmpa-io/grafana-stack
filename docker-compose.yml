---
# References:
# https://github.com/docker/awesome-compose/blob/master/prometheus-grafana/compose.yaml.
# https://github.com/ruanbekker/grafana-tempo-loki-tracing/blob/main/docker-compose.yaml.
# https://github.com/grafana/tempo/blob/main/example/docker-compose/otel-collector-multitenant/docker-compose.yaml.
# https://github.com/blueswen/fastapi-observability/blob/main/docker-compose.yaml.

# Ports are published on 127.0.0.1 only: Grafana has anonymous Admin and no login form, so it must never be
# reachable from the network this machine is on. Data lives in named volumes (see the bottom of this file) and
# survives `make stop`, `make restart` and `make run`; only `make reset` deletes it.

x-logging: &default-logging
  driver: loki
  options:
    loki-url: 'http://localhost:3100/loki/api/v1/push'
    loki-pipeline-stages: |
      - multiline:
          firstline: '^\d{4}-\d{2}-\d{2} \d{1,2}:\d{2}:\d{2}'
          max_wait_time: 3s
      - regex:
          expression: '^(?P<time>\d{4}-\d{2}-\d{2} \d{1,2}:\d{2}:\d{2},\d{3}) (?P<message>(?s:.*))$$'

services:

  loki:
    image: grafana/loki:3.4.3
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - 127.0.0.1:3100:3100
    volumes:
      - loki-data:/loki

  prometheus:
    image: prom/prometheus:v3.4.1
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus.yml
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
      - --enable-feature=native-histograms
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    ports:
      - 127.0.0.1:9090:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus.yml
      - prometheus-data:/prometheus
    logging: *default-logging
    depends_on:
      - loki

  # TODO: figure out why this version works, but latest doesn't.
  tempo:
    image: grafana/tempo:3.1.1
    container_name: tempo
    command: [ "-config.file=/etc/config.yml" ]
    ports:
      - 127.0.0.1:3200:3200   # tempo http.
      - 127.0.0.1:4317:4317   # otlp (grpc).
      - 127.0.0.1:4318:4318   # otlp (http).
    volumes:
      - ./tempo/config.yml:/etc/config.yml
      - tempo-data:/var/tempo
    logging: *default-logging
    depends_on:
      - loki
      - prometheus

  grafana:
    image: grafana/grafana:11.6.1
    container_name: grafana
    ports:
      - 127.0.0.1:3000:3000
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor metricsSummary
      - GF_USERS_DEFAULT_THEME=dark
    volumes:
      - ./grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./grafana/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana-data:/var/lib/grafana
    logging: *default-logging
    depends_on:
      - loki
      - prometheus
      - tempo

  # TODO: figure out why every version after this one fails to expose the ':8888/metrics' endpoint.
  open-telemetry-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: open-telemetry-collector
    command:
      - --config=file:/etc/config.yml
    ports:
      - 127.0.0.1:4319:4319   # otlp (grpc).
      - 127.0.0.1:4320:4320   # otlp (http).

      - 127.0.0.1:1888:1888   # pprof extension.
      - 127.0.0.1:13133:13133 # health_check extension.
      - 127.0.0.1:55679:55679 # zpages extension.

      - 127.0.0.1:8888:8888   # Prometheus metrics exposed by collector.
      - 127.0.0.1:8889:8889   # Prometheus exporter metrics.
    volumes:
      - ./open-telemetry-collector/config.yml:/etc/config.yml
    logging: *default-logging
    depends_on:
      - loki
      - tempo

# Same names and mount paths the homelab's observability stack uses when it merges its overrides over this file.
volumes:
  loki-data:
  prometheus-data:
  tempo-data:
  grafana-data:
